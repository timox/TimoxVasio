    <rect x="442" y="470" width="44" height="38" rx="5" fill="#e7f5ee"/><text x="464" y="494" class="green">8</text>
  </g>
  <rect x="46" y="523" width="726" height="38" rx="5" fill="#f5faf7"/>
  <text x="60" y="547" class="small green" font-weight="700">9–16</text>
  <text x="140" y="547" class="small muted">8 canaux disponibles</text>
  <text x="588" y="547" class="small muted">Afficher les numéros ▾</text>
  <rect x="46" y="584" width="14" height="14" rx="3" fill="#e7f5ee"/><text x="69" y="595" class="tiny muted">Disponible = aucune route enregistrée</text>
  <rect x="335" y="584" width="14" height="14" rx="3" fill="#fbead8" stroke="#dfae7e"/><text x="358" y="595" class="tiny muted">Mentionné par une route · Renoise</text>
  <rect x="612" y="584" width="14" height="14" rx="3" fill="#e5eafb" stroke="#9eaddf"/><text x="635" y="595" class="tiny muted">SuperCollider</text>

  <rect x="810" y="208" width="446" height="430" rx="10" fill="#fff" stroke="#d8e2e8"/>
  <text x="833" y="244" class="heading">Branchement rapide</text>
  <text x="833" y="269" class="small muted">Choisir où faire passer le son.</text>
  <text x="833" y="307" class="small muted">Source</text>
  <rect x="833" y="317" width="400" height="50" rx="6" fill="#fff" stroke="#b9c8d0"/>
  <rect x="846" y="329" width="8" height="26" rx="4" fill="#df8841"/>
  <text x="867" y="346" class="label">▣ Renoise · sortie virtuelle</text>
  <text x="1200" y="346" class="small muted">▾</text>
  <text x="833" y="399" class="small muted">Destination</text>
  <rect x="833" y="409" width="400" height="50" rx="6" fill="#fff" stroke="#b9c8d0"/>
  <rect x="846" y="421" width="8" height="26" rx="4" fill="#609d7b"/>
