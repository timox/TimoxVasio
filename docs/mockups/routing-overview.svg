  <text x="140" y="392" class="small muted">16 canaux disponibles</text>
  <text x="588" y="392" class="small muted">Afficher les numéros ▾</text>

  <line x1="46" x2="772" y1="428" y2="428" stroke="#e1e9ed"/>
