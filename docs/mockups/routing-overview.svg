    <rect x="651" y="315" width="38" height="38" rx="5" fill="#e7f5ee"/><text x="670" y="339" class="green">14</text>
    <rect x="694" y="315" width="38" height="38" rx="5" fill="#e7f5ee"/><text x="713" y="339" class="green">15</text>
    <rect x="737" y="315" width="38" height="38" rx="5" fill="#e7f5ee"/><text x="756" y="339" class="green">16</text>
  </g>
  <rect x="46" y="368" width="726" height="38" rx="5" fill="#f5faf7"/>
