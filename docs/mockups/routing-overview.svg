  <text x="187" y="749" class="small muted">→</text>
  <rect x="216" y="731" width="7" height="26" rx="3" fill="#609d7b"/>
  <text x="235" y="749" class="small" font-weight="700">◉ SSL sorties physiques</text>
  <text x="739" y="749" class="small muted">1–2 → 1–2 · stéréo</text>
  <text x="1021" y="749" class="small green">● Appliqué</text>
  <text x="1205" y="749" class="small muted">▾</text>
  <rect x="46" y="777" width="1188" height="42" rx="6" fill="#f7f9fb"/>
  <rect x="57" y="786" width="7" height="24" rx="3" fill="#5d77c6"/>
  <text x="77" y="804" class="small" font-weight="700">▣ SuperCollider</text>
  <text x="212" y="804" class="small muted">→</text>
  <rect x="239" y="786" width="7" height="24" rx="3" fill="#609d7b"/>
  <text x="258" y="804" class="small" font-weight="700">◉ SSL sorties physiques</text>
  <text x="739" y="804" class="small muted">1–2 → 7–8 · stéréo</text>
  <text x="1021" y="804" class="small green">● Appliqué</text>
  <text x="1205" y="804" class="small muted">▾</text>
  <text x="27" y="864" class="tiny muted">Disponibilité indicative : les routes ne verrouillent aucun canal. Les vues Connections et Matrix restent accessibles.</text>
</svg>
