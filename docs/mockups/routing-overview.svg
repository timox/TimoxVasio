  <text x="967" y="503" class="small muted">Mono  ○</text>
  <rect x="833" y="537" width="400" height="51" rx="6" fill="#eef7f0" stroke="#b5d9c1"/>
  <text x="848" y="558" class="small green" font-weight="700">Paire disponible dans les routes</text>
  <text x="848" y="578" class="small muted">Proposition : Renoise 3–4 → SSL 3–4</text>
  <text x="837" y="614" class="tiny muted">Les applications doivent être réglées sur ces numéros.</text>

  <rect x="24" y="654" width="1232" height="178" rx="10" fill="#fff" stroke="#d8e2e8"/>
