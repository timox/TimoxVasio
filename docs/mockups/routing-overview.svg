<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="890" viewBox="0 0 1280 890" role="img" aria-labelledby="title desc">
  <title id="title">Maquette de la vue globale des branchements Timox VASIO</title>
  <desc id="desc">Vue compacte des canaux physiques de la SSL, avec canaux disponibles et réservés par les routes, branchement rapide et routes enregistrées repliables.</desc>
  <defs>
    <style>
      text { font-family: Segoe UI, Arial, sans-serif; fill: #20313e; }
      .small { font-size: 13px; }
      .tiny { font-size: 11px; }
      .label { font-size: 14px; font-weight: 600; }
      .heading { font-size: 20px; font-weight: 700; }
      .muted { fill: #5c6e7b; }
      .white { fill: #fff; }
      .orange { fill: #a44d12; }
      .blue { fill: #3554a8; }
      .green { fill: #276b55; }
    </style>
  </defs>
  <rect width="1280" height="890" fill="#f4f7f9"/>
  <rect x="0" y="0" width="1280" height="64" fill="#fff"/>
  <rect x="0" y="62" width="1280" height="2" fill="#d8e2e8"/>
  <text x="32" y="39" font-size="20" font-weight="700">Timox VASIO Control</text>
  <text x="1080" y="38" class="small muted">Moteur actif  ●</text>
  <text x="32" y="101" class="small muted">Configuration</text>
  <text x="153" y="101" class="small" font-weight="700">Channels</text>
  <rect x="151" y="113" width="68" height="3" fill="#2b6974"/>
  <text x="252" y="101" class="small muted">Analysis</text>
  <text x="343" y="101" class="small muted">Performance</text>
  <text x="455" y="101" class="small muted">API and Swagger</text>
  <rect x="24" y="133" width="1232" height="58" rx="8" fill="#fff" stroke="#d8e2e8"/>
  <text x="45" y="159" class="small" font-weight="700">Vue globale</text>
  <rect x="40" y="171" width="86" height="3" fill="#2b6974"/>
  <text x="156" y="159" class="small muted">Branchement rapide</text>
  <text x="331" y="159" class="small muted">Connections</text>
  <text x="447" y="159" class="small muted">Matrix</text>
  <text x="1092" y="160" class="tiny muted">Maquette · état fictif</text>

  <rect x="24" y="208" width="770" height="430" rx="10" fill="#fff" stroke="#d8e2e8"/>
  <text x="46" y="244" class="heading">Interface physique · SSL ASIO Driver</text>
  <text x="46" y="268" class="small muted">Canaux mentionnés par les routes enregistrées. Les autres sont disponibles pour une proposition.</text>
  <rect x="636" y="222" width="136" height="30" rx="15" fill="#e7f5ee"/>
  <text x="655" y="242" class="small green" font-weight="700">Moteur connecté</text>

