  <text x="1123" y="690" class="small muted">2 groupes ▾</text>
  <line x1="46" x2="1234" y1="706" y2="706" stroke="#e1e9ed"/>
  <rect x="46" y="722" width="1188" height="44" rx="6" fill="#f7f9fb"/>
  <rect x="57" y="731" width="7" height="26" rx="3" fill="#df8841"/>
