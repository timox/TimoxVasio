<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">TimoxVasio: audio flow and control</title>
  <desc id="d">ASIO applications go through the TimoxVasio virtual driver. The routing engine connects channels in a matrix to other applications or to the physical interface, which provides the master clock. Control and user scripts drive the engine through a local HTTP/WebSocket API.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9da7b3"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#0d1117"/>
  <text x="30" y="42" font-size="20" font-weight="700" fill="#e6edf3">TimoxVasio: audio between applications, no cables</text>

  <!-- Applications -->
  <text x="130" y="78" font-size="12" font-weight="600" fill="#9da7b3" text-anchor="middle">ASIO APPLICATIONS</text>
  <g font-size="14" fill="#e6edf3" text-anchor="middle">
    <rect x="30" y="90" width="200" height="70" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="130" y="120" font-weight="700">Renoise</text>
    <text x="130" y="140" font-size="12" fill="#9da7b3">Tracker</text>
    <rect x="30" y="175" width="200" height="70" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="130" y="205" font-weight="700">Ableton Live</text>
    <text x="130" y="225" font-size="12" fill="#9da7b3">DAW</text>
    <rect x="30" y="260" width="200" height="70" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="130" y="290" font-weight="700">Mixxx</text>
    <text x="130" y="310" font-size="12" fill="#9da7b3">DJ software</text>
    <rect x="30" y="345" width="200" height="70" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="130" y="375" font-weight="700">SuperCollider</text>
    <text x="130" y="395" font-size="12" fill="#9da7b3">Synthesis engine</text>
  </g>

  <!-- Apps <-> driver -->
  <g stroke="#9da7b3" stroke-width="1.6" fill="none">
    <path d="M232 125H263" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M232 210H263" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M232 295H263" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M232 380H263" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>

  <!-- Driver -->
  <rect x="265" y="90" width="140" height="325" rx="12" fill="#241c3d" stroke="#a78bfa" stroke-width="2"/>
  <g text-anchor="middle" fill="#e6edf3">
    <text x="335" y="215" font-size="15" font-weight="700">TimoxVasio</text>
    <text x="335" y="240" font-size="12">One driver</text>
    <text x="335" y="257" font-size="12">for every</text>
    <text x="335" y="274" font-size="12">application</text>
    <text x="335" y="301" font-size="12" font-weight="600" fill="#a78bfa">256 in / 256 out</text>
    <text x="335" y="318" font-size="12" fill="#a78bfa">per application</text>
  </g>

  <!-- Driver <-> engine -->
  <path d="M407 250H443" stroke="#9da7b3" stroke-width="2.4" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Engine -->
  <rect x="445" y="70" width="260" height="365" rx="12" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="2"/>
  <text x="575" y="96" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">Routing engine</text>

  <!-- Matrix -->
  <g font-size="11" fill="#c9d1d9">
    <text x="580" y="140" text-anchor="middle" font-weight="600">SC</text>
    <text x="620" y="140" text-anchor="middle" font-weight="600">Live</text>
    <text x="660" y="140" text-anchor="middle" font-weight="600">SSL</text>
    <text x="552" y="172" text-anchor="end">Renoise 1-2</text>
    <text x="552" y="208" text-anchor="end">Renoise 3-4</text>
    <text x="552" y="244" text-anchor="end">Live 1-2</text>
    <text x="552" y="280" text-anchor="end">Mixxx 1-2</text>
    <text x="552" y="316" text-anchor="end">Synths</text>
  </g>
  <g stroke="#1f5556" stroke-width="1">
    <path d="M560 150H680M560 186H680M560 222H680M560 258H680M560 294H680M560 330H680"/>
    <path d="M560 150V330M600 150V330M640 150V330M680 150V330"/>
  </g>
  <rect x="640" y="150" width="40" height="144" fill="#2dd4bf" fill-opacity="0.10"/>
  <g fill="#2dd4bf">
    <circle cx="660" cy="168" r="7"/>
    <circle cx="580" cy="204" r="7"/>
    <circle cx="660" cy="240" r="7"/>
    <circle cx="660" cy="276" r="7"/>
    <circle cx="580" cy="312" r="7"/>
    <circle cx="620" cy="312" r="7"/>
  </g>
  <text x="660" y="346" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">Σ</text>

  <g font-size="12" fill="#e6edf3">
    <text x="465" y="370"><tspan font-weight="700" fill="#2dd4bf">Σ</tspan>  Sources are summed</text>
    <text x="465" y="388">•  Gain and mute per route</text>
    <text x="465" y="406">•  Routes follow the executable</text>
    <text x="465" y="424">•  No sample-rate conversion</text>
  </g>

  <!-- Engine <-> physical -->
  <path d="M707 240H743" stroke="#9da7b3" stroke-width="2.4" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="725" y="228" font-size="10" fill="#9da7b3" text-anchor="middle">ASIO</text>

  <!-- Physical -->
  <text x="840" y="78" font-size="12" font-weight="600" fill="#9da7b3" text-anchor="middle">HARDWARE</text>
  <rect x="745" y="90" width="190" height="50" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="840" y="120" font-size="13" fill="#e6edf3" text-anchor="middle">Inputs: synths</text>
  <path d="M840 142V168" stroke="#9da7b3" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <rect x="745" y="170" width="190" height="140" rx="12" fill="#33250a" stroke="#f0b24a" stroke-width="2"/>
  <g text-anchor="middle" fill="#e6edf3">
    <text x="840" y="210" font-size="15" font-weight="700">Physical ASIO interface</text>
    <text x="840" y="230" font-size="12" fill="#9da7b3">e.g. SSL 12</text>
    <text x="840" y="262" font-size="12" font-weight="600" fill="#f0b24a">Master clock</text>
    <text x="840" y="280" font-size="12" fill="#f0b24a">sample rate and buffer</text>
    <text x="840" y="296" font-size="12" fill="#f0b24a">shared by everyone</text>
  </g>
  <path d="M840 312V348" stroke="#9da7b3" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <rect x="745" y="350" width="190" height="50" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="840" y="380" font-size="13" fill="#e6edf3" text-anchor="middle">Outputs: monitors, phones</text>

  <!-- Engine <-> API -->
  <path d="M575 437V461" stroke="#2dd4bf" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-start="url(#ac)" marker-end="url(#ac)"/>

  <!-- API -->
  <rect x="445" y="463" width="260" height="56" rx="10" fill="#0d1117" stroke="#2dd4bf" stroke-width="2"/>
  <text x="575" y="487" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">Local API</text>
  <text x="575" y="506" font-size="11" fill="#2dd4bf" text-anchor="middle">HTTP + WebSocket · OpenAPI · 127.0.0.1 only</text>

  <!-- API <-> clients -->
  <g stroke="#2dd4bf" stroke-width="1.6" stroke-dasharray="5 4" fill="none">
    <path d="M507 521V543" marker-start="url(#ac)" marker-end="url(#ac)"/>
    <path d="M642 521V543" marker-start="url(#ac)" marker-end="url(#ac)"/>
  </g>

  <!-- Clients -->
  <rect x="445" y="545" width="125" height="58" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="507" y="569" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">VASIO Control</text>
  <text x="507" y="587" font-size="11" fill="#9da7b3" text-anchor="middle">Matrix, meters</text>
  <rect x="580" y="545" width="125" height="58" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="642" y="569" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">Your scripts</text>
  <text x="642" y="587" font-size="11" fill="#9da7b3" text-anchor="middle">PowerShell, Node…</text>

  <!-- API features -->
  <g font-size="12" fill="#e6edf3">
    <text x="745" y="487" font-weight="600" fill="#2dd4bf">What the API exposes</text>
    <text x="745" y="507">•  Clients and open channels</text>
    <text x="745" y="525">•  Routes: read, apply, persist</text>
    <text x="745" y="543">•  Live meters, stereo correlation</text>
    <text x="745" y="561">•  Engine start / stop, logs</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#c9d1d9">
    <path d="M30 555H70" stroke="#9da7b3" stroke-width="2"/>
    <text x="80" y="559">Audio</text>
    <path d="M30 580H70" stroke="#2dd4bf" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="80" y="584">Control</text>
  </g>
</svg>
