<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Avant et après TimoxVasio</title>
  <desc id="d">Avec un pilote ASIO classique, une application tient la carte et les autres sont bloquées. Avec TimoxVasio, toutes les applications ouvrent le même pilote virtuel en même temps et le moteur les relie entre elles et à la carte.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
    <g id="lock">
      <path d="M-6 -2V-7a6 6 0 0 1 12 0V-2" fill="none" stroke="#c0392b" stroke-width="2.2"/>
      <rect x="-9" y="-2" width="18" height="14" rx="3" fill="#c0392b"/>
    </g>
  </defs>

  <rect width="960" height="470" fill="#ffffff"/>

  <!-- Left panel -->
  <rect x="20" y="20" width="440" height="430" rx="16" fill="#fbf4f3" stroke="#e3c4c0"/>
  <text x="240" y="54" font-size="18" font-weight="700" fill="#222" text-anchor="middle">Pilote ASIO classique</text>
  <text x="240" y="76" font-size="13" fill="#8a3a30" text-anchor="middle">Une application à la fois</text>

  <g font-size="14" text-anchor="middle">
    <rect x="45" y="100" width="170" height="54" rx="10" fill="#f6f6f6" stroke="#9a9a9a"/>
    <text x="130" y="132" font-weight="700" fill="#222">Renoise</text>

    <rect x="45" y="174" width="170" height="54" rx="10" fill="#f4eeee" stroke="#ddcfcd" stroke-dasharray="4 3"/>
    <text x="130" y="206" fill="#a59a99">Ableton Live</text>
    <use href="#lock" x="236" y="200"/>

    <rect x="45" y="248" width="170" height="54" rx="10" fill="#f4eeee" stroke="#ddcfcd" stroke-dasharray="4 3"/>
    <text x="130" y="280" fill="#a59a99">Mixxx</text>
    <use href="#lock" x="236" y="274"/>

    <rect x="45" y="322" width="170" height="54" rx="10" fill="#f4eeee" stroke="#ddcfcd" stroke-dasharray="4 3"/>
    <text x="130" y="354" fill="#a59a99">SuperCollider</text>
    <use href="#lock" x="236" y="348"/>
  </g>

  <path d="M217 127C270 127 270 230 300 230" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="302" y="190" width="140" height="80" rx="12" fill="#fff6e6" stroke="#d98a00" stroke-width="2"/>
  <text x="372" y="225" font-size="14" font-weight="700" fill="#222" text-anchor="middle">Carte son</text>
  <text x="372" y="245" font-size="12" fill="#b06f00" text-anchor="middle">pilote ASIO</text>

  <text x="240" y="412" font-size="13" fill="#8a3a30" text-anchor="middle">Les autres attendent, ou il faut fermer et rouvrir.</text>
  <text x="240" y="432" font-size="13" fill="#8a3a30" text-anchor="middle">Pas de son entre applications.</text>

  <!-- Right panel -->
  <rect x="500" y="20" width="440" height="430" rx="16" fill="#f1f8f8" stroke="#b9dcdc"/>
  <text x="720" y="54" font-size="18" font-weight="700" fill="#222" text-anchor="middle">Avec TimoxVasio</text>
  <text x="720" y="76" font-size="13" fill="#0f6e70" text-anchor="middle">Toutes les applications en même temps</text>

  <g font-size="14" text-anchor="middle" fill="#222">
    <rect x="520" y="100" width="130" height="54" rx="10" fill="#f6f6f6" stroke="#9a9a9a"/>
    <text x="585" y="132" font-weight="700">Renoise</text>
    <rect x="520" y="174" width="130" height="54" rx="10" fill="#f6f6f6" stroke="#9a9a9a"/>
    <text x="585" y="206" font-weight="700">Ableton Live</text>
    <rect x="520" y="248" width="130" height="54" rx="10" fill="#f6f6f6" stroke="#9a9a9a"/>
    <text x="585" y="280" font-weight="700">Mixxx</text>
    <rect x="520" y="322" width="130" height="54" rx="10" fill="#f6f6f6" stroke="#9a9a9a"/>
    <text x="585" y="354" font-weight="700">SuperCollider</text>
  </g>

  <g stroke="#555" stroke-width="1.6" fill="none">
    <path d="M652 127H678" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M652 201H678" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M652 275H678" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M652 349H678" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>

  <rect x="680" y="100" width="110" height="276" rx="12" fill="#efeafd" stroke="#6b4fd8" stroke-width="2"/>
  <g text-anchor="middle" fill="#222">
    <text x="735" y="218" font-size="14" font-weight="700">TimoxVasio</text>
    <text x="735" y="240" font-size="12">pilote</text>
    <text x="735" y="262" font-size="12">+ moteur</text>
    <text x="735" y="280" font-size="12">de routage</text>
  </g>

  <path d="M792 238H822" stroke="#555" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect x="824" y="190" width="104" height="96" rx="12" fill="#fff6e6" stroke="#d98a00" stroke-width="2"/>
  <text x="876" y="226" font-size="14" font-weight="700" fill="#222" text-anchor="middle">Carte</text>
  <text x="876" y="244" font-size="14" font-weight="700" fill="#222" text-anchor="middle">son</text>
  <text x="876" y="266" font-size="11" fill="#b06f00" text-anchor="middle">horloge maître</text>

  <text x="720" y="412" font-size="13" fill="#0f6e70" text-anchor="middle">Les applications s'envoient du son</text>
  <text x="720" y="432" font-size="13" fill="#0f6e70" text-anchor="middle">et vers la carte. Sans verrou ni câble.</text>
</svg>
